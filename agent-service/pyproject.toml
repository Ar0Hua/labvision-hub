[project]
name = "labvision-agent-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
retrieval = ["qdrant-client>=1.12,<2"]
agent = ["langgraph>=0.2,<1", "dashscope>=1.20,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
labvision-qdrant-init = "app.indexing.qdrant_schema:main"
labvision-index-worker = "app.indexing.worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
